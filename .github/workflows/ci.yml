name: Verify and trigger Jenkins CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  DATABASE_URL: postgresql+psycopg://agent:agent@localhost:5432/agent_series

jobs:
  verify:
    name: GitHub Actions verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agent_series
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agent -d agent_series"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install and test backend
        run: |
          python -m pip install --require-hashes --requirement requirements-ci.lock
          python -m alembic upgrade head
          mkdir -p test-results
          python -m coverage run -m pytest -q --junitxml=test-results/backend-junit.xml
          python -m coverage xml -o test-results/backend-coverage.xml
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run format:check
          npm run lint
          npm run build
      - name: Upload verify reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  trigger-jenkins:
    name: Trigger Jenkins security CI
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the exact commit
        env:
          JENKINS_TRIGGER_URL: ${{ secrets.JENKINS_TRIGGER_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          JENKINS_JOB_TOKEN: ${{ secrets.JENKINS_JOB_TOKEN }}
        run: |
          set -euo pipefail
          for value in JENKINS_TRIGGER_URL JENKINS_USER JENKINS_API_TOKEN JENKINS_JOB_TOKEN; do
            test -n "${!value}" || { echo "Missing required GitHub secret: $value"; exit 1; }
          done
          curl --fail --show-error --silent --user "$JENKINS_USER:$JENKINS_API_TOKEN" \
            --request POST "$JENKINS_TRIGGER_URL" \
            --data-urlencode "token=$JENKINS_JOB_TOKEN" \
            --data-urlencode "GIT_URL=${{ github.server_url }}/${{ github.repository }}.git" \
            --data-urlencode "GIT_SHA=${{ github.sha }}" \
            --data-urlencode "GIT_REF=${{ github.ref_name }}"
