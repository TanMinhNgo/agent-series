name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  DATABASE_URL: postgresql+psycopg://agent:agent@localhost:5432/agent_series

jobs:
  verify:
    name: Verify backend and frontend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agent_series
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_series"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install backend dependencies
        # The lock pins the CPU-only PyTorch wheel and every transitive dependency.
        run: python -m pip install --require-hashes --requirement requirements-ci.lock

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Test backend with coverage
        run: |
          mkdir -p test-results
          python -m coverage run -m pytest -q --junitxml=test-results/backend-junit.xml
          python -m coverage xml -o test-results/backend-coverage.xml

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Check frontend formatting and lint
        working-directory: frontend
        run: |
          npm run format:check
          npm run lint

      - name: Build deployable release bundle
        working-directory: frontend
        run: |
          npm run build
          mkdir -p ../deployment-package/frontend ../deployment-package/backend
          cp -R dist ../deployment-package/frontend/dist
          cp -R ../api ../agent_core ../migrations ../deployment-package/backend/
          cp ../requirements.txt ../alembic.ini ../deployment-package/backend/
          printf '{"version":"%s","runNumber":"%s","builtAt":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ../deployment-package/version.json

      - name: Upload deployable system artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-series-deploy-${{ github.sha }}
          path: deployment-package/
          if-no-files-found: error
          retention-days: 30

  sonarqube:
    name: SonarQube analysis
    needs: verify
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    # Configure both repository secrets to enable the self-hosted SonarQube scan.
    steps:
      - if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - if: ${{ env.SONAR_TOKEN != '' }}
        name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: test-results

      - if: ${{ env.SONAR_TOKEN != '' }}
        name: Scan with SonarQube
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
