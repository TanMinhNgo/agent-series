sonar.projectKey=agent-series
sonar.projectName=Agent Series
sonar.sourceEncoding=UTF-8

sonar.sources=api,agent_core,frontend/src
sonar.tests=tests,frontend/src
sonar.test.inclusions=tests/**/*.py,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.exclusions=frontend/dist/**,frontend/node_modules/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**,migrations/**
sonar.coverage.exclusions=tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**,migrations/**
sonar.python.coverage.reportPaths=test-results/backend-coverage.xml
sonar.python.xunit.reportPath=test-results/backend-junit.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
