sonar.projectKey=agent-series
sonar.projectName=Agent Series
sonar.sourceEncoding=UTF-8

sonar.sources=api,agent_core,frontend/src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
sonar.exclusions=frontend/dist/**,frontend/node_modules/**,migrations/**
sonar.coverage.exclusions=tests/**,migrations/**
sonar.python.coverage.reportPaths=test-results/backend-coverage.xml
sonar.python.xunit.reportPath=test-results/backend-junit.xml
